server {
    listen 80;
    listen [::]:80;
    server_name notes.andaas.org;

    root /var/www/pinball-notes;
    index index.php;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ ^/(index|login|logout|api)\.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Block direct access to data and token files
    location ~ \.(json)$ {
        deny all;
    }

    # Block direct access to PHP includes (not entry points)
    location ~ ^/(auth|config)\.php$ {
        deny all;
    }
}
